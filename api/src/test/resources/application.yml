# Configuration for testing (overrides application.yml and application-dev.yml)
spring:
  # Disable profile activation from env vars so we don't accidentally load 'prod' or 'dev'
  profiles:
    active: test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
