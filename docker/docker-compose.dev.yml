version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: red-api:local
    env_file:
      - ../.env
    environment:
      # Required settings
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/red_dev
      APP_FRONTEND_BASE_URL: http://localhost:3000
      
      # Mail config - set here OR in .env file (values here override .env)
      # SPRING_MAIL_USERNAME: reducalgarybookings@gmail.com
      # SPRING_MAIL_PASSWORD: your-app-password-here
      # APP_MAIL_FROM_ADDRESS: reducalgarybookings@gmail.com
      # APP_MAIL_COPY_ADDRESS: reducalgary@gmail.com
      
      # Admin credentials - set here OR in .env file (values here override .env)
      # APP_ADMIN_USERNAME: admin
      # APP_ADMIN_PASSWORD: admin
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: red_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
